<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>仙八色鸫音频真值核对</title>
<style>
  :root { --bd:#d0d7de; --mut:#6b7280; --keep:#2e7d32; --drop:#9ca3af; --new:#1565c0; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; color:#1f2937; background:#f6f7f9; }
  header { display:flex; align-items:center; gap:14px; padding:10px 16px; background:#fff; border-bottom:1px solid var(--bd); position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sp { flex:1; }
  button { font:inherit; padding:4px 10px; border:1px solid var(--bd); background:#fff; border-radius:6px; cursor:pointer; }
  button:hover { background:#f0f3f7; }
  button.primary { background:#1565c0; border-color:#1565c0; color:#fff; }
  button.primary:hover { background:#0d4f9e; }
  button.warn { color:#b91c1c; border-color:#f3c1c1; }
  #wrap { display:flex; height:calc(100vh - 53px); }
  aside { width:270px; border-right:1px solid var(--bd); background:#fff; overflow:auto; padding:8px; }
  aside .clip { padding:7px 9px; border-radius:6px; cursor:pointer; margin-bottom:2px; }
  aside .clip:hover { background:#f0f3f7; }
  aside .clip.on { background:#e8f0fe; }
  aside .clip .n { font-weight:600; font-size:13px; word-break:break-all; }
  aside .clip .m { color:var(--mut); font-size:12px; }
  aside .clip .ok { color:var(--keep); }
  main { flex:1; overflow:auto; padding:12px 16px; }
  #bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:8px; }
  #bar .ttl { font-weight:600; }
  #bar .mut { color:var(--mut); font-size:12px; }
  audio { width:100%; margin-bottom:8px; }
  #cvbox { background:#fff; border:1px solid var(--bd); border-radius:8px; padding:6px; }
  canvas { display:block; width:100%; height:160px; cursor:crosshair; }
  #tools { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--bd); border-radius:8px; overflow:hidden; }
  th,td { padding:5px 8px; border-bottom:1px solid #eef1f4; font-size:13px; text-align:left; }
  th { background:#f8fafc; color:#374151; font-weight:600; white-space:nowrap; }
  tr.sel td { background:#eef5ff; }
  tr.drop td { color:#9ca3af; background:#fafafa; }
  tr.drop td.st { text-decoration:line-through; }
  td.num { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .tag { display:inline-block; padding:1px 7px; border-radius:10px; font-size:12px; border:1px solid; }
  .tag.keep { color:var(--keep); border-color:#a7d4a8; background:#f0f9f0; }
  .tag.drop { color:#6b7280; border-color:#d1d5db; background:#f3f4f6; }
  .tag.new { color:var(--new); border-color:#a9c8ea; background:#eff6ff; }
  .seg { display:inline-flex; border:1px solid var(--bd); border-radius:6px; overflow:hidden; }
  .seg button { border:0; border-radius:0; padding:3px 8px; }
  .seg button.on { background:#1565c0; color:#fff; }
  #modal { position:fixed; inset:0; background:rgba(15,23,42,.45); display:none; align-items:center; justify-content:center; z-index:20; }
  #modal.on { display:flex; }
  #modal .card { background:#fff; border-radius:10px; width:min(760px,92vw); padding:14px; }
  #modal textarea { width:100%; height:260px; font:12px/1.5 Consolas,monospace; }
  #modal .row { display:flex; gap:8px; justify-content:flex-end; margin-top:10px; }
  .kbd { font:12px Consolas,monospace; background:#f3f4f6; border:1px solid #e5e7eb; border-radius:4px; padding:0 4px; }
</style>
</head>
<body>
<header>
  <h1>仙八色鸫音频真值核对</h1>
  <span class="mut" id="prog">已听 0/9</span>
  <span class="mut" id="kept"></span>
  <span class="sp"></span>
  <button id="btnExport" class="primary">导出 events_truth.csv</button>
  <button id="btnReset" class="warn">恢复草稿</button>
</header>

<div id="wrap">
  <aside id="clips"></aside>
  <main>
    <div id="bar">
      <span class="ttl" id="clipTitle">—</span>
      <span class="mut" id="clipMeta"></span>
    </div>
    <audio id="au" controls preload="metadata"></audio>
    <div id="cvbox"><canvas id="cv"></canvas></div>
    <div id="tools">
      <button id="btnPlay">播放 / 暂停 <span class="kbd">空格</span></button>
      <span class="seg" id="speed">
        <button data-r="1" class="on">1×</button>
        <button data-r="1.5">1.5×</button>
        <button data-r="2">2×</button>
      </span>
      <button id="btnPrev">↑ 上一处 <span class="kbd">J</span></button>
      <button id="btnNext">↓ 下一处 <span class="kbd">L</span></button>
      <button id="btnAdd">＋ 在播放头新增 <span class="kbd">N</span></button>
      <button id="btnKeep">保留选中 <span class="kbd">K</span></button>
      <button id="btnDrop">标为噪声 <span class="kbd">D</span></button>
      <button id="btnUndo">撤销 <span class="kbd">Ctrl+Z</span></button>
      <button id="btnDone">本段已听完 ✓</button>
    </div>
    <table>
      <thead><tr><th>#</th><th>起(s)</th><th>止(s)</th><th>时长</th><th>底噪</th><th>状态</th><th>判定 / 微调（0.2 s）</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="mut" style="margin:10px 0 30px">
      绿块 = 保留（计入真值）；灰块 = 噪声/误报；蓝块 = 你新增的漏检事件。
      判据只看“这段里到底有没有仙八色鸫鸣声”，与模型分数无关；起止差 0.3 s 以内不影响召回（匹配按重叠算）。
    </p>
  </main>
</div>

<div id="modal"><div class="card">
  <div style="font-weight:600;margin-bottom:6px">events_truth.csv（全选复制，或直接关闭用下载的文件）</div>
  <textarea id="outTxt" readonly></textarea>
  <div class="row"><button id="btnCopy">复制</button><button id="btnClose">关闭</button></div>
</div></div>

<script>
const DATA = __DATA__;
const KEY = "pitta_truth_review_v1";
const au = document.getElementById("au");
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

let state = load() || buildDefault();
let cur = 0;
let sel = -1;
let undoStack = [];
let playEnd = 0;

function buildDefault() {
  const s = {version: DATA.version, clips: []};
  DATA.clips.forEach(c => {
    s.clips.push({
      file: c.file, dur: c.dur, wins: c.wins, checked: false,
      events: c.events.map(e => ({s: e.s, e: e.e, st: "keep"}))
    });
  });
  return s;
}
function load() {
  try {
    const t = localStorage.getItem(KEY);
    if (!t) return null;
    const s = JSON.parse(t);
    if (!s || s.version !== DATA.version || !s.clips || s.clips.length !== DATA.clips.length) return null;
    return s;
  } catch (err) { return null; }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (err) {} }
function snapshot() {
  undoStack.push(JSON.stringify(state.clips[cur].events) + "|" + state.clips[cur].checked);
  if (undoStack.length > 200) undoStack.shift();
}
function undo() {
  if (!undoStack.length) return;
  const p = undoStack.pop().split("|");
  state.clips[cur].events = JSON.parse(p[0]);
  state.clips[cur].checked = p[1] === "true";
  sel = -1; save(); renderAll();
}

function fmt(x) { return x.toFixed(2); }
function c() { return state.clips[cur]; }

function renderClips() {
  const box = document.getElementById("clips");
  box.innerHTML = "";
  state.clips.forEach((cl, i) => {
    const kept = cl.events.filter(e => e.st !== "drop").length;
    const div = document.createElement("div");
    div.className = "clip" + (i === cur ? " on" : "");
    div.innerHTML = '<div class="n">' + cl.file.replace(/^pos_pitta_nympha_/, "") + '</div>' +
      '<div class="m">' + Math.round(cl.dur) + ' s · 保留 ' + kept + ' / ' + cl.events.length +
      (cl.checked ? ' · <span class="ok">已听 ✓</span>' : '') + '</div>';
    div.onclick = () => { cur = i; sel = -1; undoStack = []; loadClip(); };
    box.appendChild(div);
  });
  const done = state.clips.filter(cl => cl.checked).length;
  document.getElementById("prog").textContent = "已听 " + done + "/" + state.clips.length;
  let keptAll = 0, all = 0;
  state.clips.forEach(cl => {
    keptAll += cl.events.filter(e => e.st !== "drop").length;
    all += cl.events.length;
  });
  document.getElementById("kept").textContent = "真值事件 " + keptAll + "（候选 " + all + "）";
}

function loadClip() {
  const cl = c();
  au.src = "../" + cl.file;
  au.playbackRate = 1;
  playEnd = 0;
  document.getElementById("clipTitle").textContent = cl.file;
  document.getElementById("clipMeta").textContent = "时长 " + cl.dur.toFixed(1) + " s";
  document.getElementById("btnDone").textContent = cl.checked ? "已听完 ✓（点击取消）" : "本段已听完 ✓";
  renderAll();
}

function renderRows() {
  const tb = document.getElementById("rows");
  tb.innerHTML = "";
  const cl = c();
  cl.events.forEach((e, i) => {
    const tr = document.createElement("tr");
    tr.className = (i === sel ? "sel " : "") + (e.st === "drop" ? "drop" : "");
    const tagCls = e.st === "keep" ? "keep" : (e.st === "new" ? "new" : "drop");
    const tagTxt = e.st === "keep" ? "保留" : (e.st === "new" ? "新增" : "噪声");
    tr.innerHTML =
      '<td class="num">' + (i + 1) + '</td>' +
      '<td class="num">' + fmt(e.s) + '</td>' +
      '<td class="num">' + fmt(e.e) + '</td>' +
      '<td class="num">' + fmt(Math.max(0, e.e - e.s)) + ' s</td>' +
      '<td class="num">' + rmsAt(e) + '</td>' +
      '<td><span class="tag ' + tagCls + '">' + tagTxt + '</span></td>' +
      '<td><button data-i="' + i + '" data-a="play">▶ 听</button> ' +
        '<button data-i="' + i + '" data-a="s-">起−</button> ' +
        '<button data-i="' + i + '" data-a="s+">起＋</button> ' +
        '<button data-i="' + i + '" data-a="e-">止−</button> ' +
        '<button data-i="' + i + '" data-a="e+">止＋</button> ' +
        '<button data-i="' + i + '" data-a="toggle">保留/噪声</button>' +
      '</td>';
    tr.onclick = (ev) => { if (ev.target.tagName !== "BUTTON") { sel = i; renderRows(); draw(); } };
    tb.appendChild(tr);
  });
  tb.querySelectorAll("button").forEach(b => {
    b.onclick = (ev) => {
      ev.stopPropagation();
      const i = +b.dataset.i, a = b.dataset.a;
      sel = i;
      act(a, i);
    };
  });
}

function rmsAt(e) {
  const cl = c();
  let best = null, bestOv = 0;
  cl.wins.forEach(w => {
    const ov = Math.min(e.e, w[0] + 2) - Math.max(e.s, w[0]);
    if (ov > bestOv) { bestOv = ov; best = w; }
  });
  return best ? best[2].toFixed(1) + " dB" : "—";
}

function act(a, i) {
  const e = c().events[i];
  if (!e) return;
  snapshot();
  if (a === "play") { playRange(e.s - 0.3, e.e + 0.3); return; }
  if (a === "toggle") e.st = e.st === "drop" ? "keep" : "drop";
  if (a === "s-") e.s = Math.max(0, e.s - 0.2);
  if (a === "s+") e.s = Math.min(e.e - 0.1, e.s + 0.2);
  if (a === "e-") e.e = Math.max(e.s + 0.1, e.e - 0.2);
  if (a === "e+") e.e = e.e + 0.2;
  save(); renderClips(); renderRows(); draw();
}

function playRange(a, b) {
  au.currentTime = Math.max(0, a);
  playEnd = Math.min(c().dur, b);
  au.play();
}

function draw() {
  const cl = c();
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = 160;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const padL = 34, padR = 8;
  const rmsTop = 14, rmsBot = 82;          // 上轨：能量
  const evTop = 90, evBot = 118;           // 下轨：事件
  const axisY = 124;
  const x = t => padL + (t / cl.dur) * (W - padL - padR);

  // 上轨：RMS 能量（每窗一个柱，-60..0 dBFS）
  const hop = cl.wins.length > 1 ? (cl.wins[1][0] - cl.wins[0][0]) : 0.5;
  ctx.fillStyle = "#e5e7eb";
  cl.wins.forEach(w => {
    const db = Math.max(-60, Math.min(0, w[2]));
    const h = Math.max(1, (db + 60) / 60 * (rmsBot - rmsTop));
    const x0 = x(w[0]);
    const wpx = Math.max(1, (hop / cl.dur) * (W - padL - padR) - 0.4);
    ctx.fillRect(x0, rmsBot - h, wpx, h);
  });
  ctx.fillStyle = "#c7cdd4";
  ctx.fillRect(padL, rmsBot, W - padL - padR, 1);

  // 下轨：事件块
  cl.events.forEach((e, i) => {
    const x0 = x(e.s), x1 = x(e.e);
    let fill = "rgba(46,125,50,.30)", stroke = "#2e7d32";
    if (e.st === "drop") { fill = "rgba(156,163,175,.30)"; stroke = "#9ca3af"; }
    if (e.st === "new") { fill = "rgba(21,101,192,.28)"; stroke = "#1565c0"; }
    ctx.fillStyle = fill; ctx.strokeStyle = stroke;
    ctx.lineWidth = i === sel ? 2.5 : 1;
    const w = Math.max(3, x1 - x0);
    ctx.fillRect(x0, evTop, w, evBot - evTop);
    ctx.strokeRect(x0 + .5, evTop + .5, w - 1, evBot - evTop - 1);
  });

  // 坐标轴
  ctx.fillStyle = "#6b7280"; ctx.font = "11px Consolas,monospace";
  const step = cl.dur > 120 ? 20 : (cl.dur > 40 ? 10 : 5);
  for (let t = 0; t <= cl.dur; t += step) {
    ctx.fillRect(x(t), evBot, 1, 3);
    ctx.fillText(t + "s", Math.min(x(t) - 6, W - 26), axisY + 10);
  }
  ctx.fillStyle = "#9ca3af";
  ctx.fillText("0dB", 2, rmsTop + 8);
  ctx.fillText("-60", 2, rmsBot);

  // 播放头
  if (au.duration) {
    const px = x(Math.min(au.currentTime, cl.dur));
    ctx.strokeStyle = "#dc2626"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(px, rmsTop); ctx.lineTo(px, evBot); ctx.stroke();
  }
}

function renderAll() { renderClips(); renderRows(); draw(); }

function nearestEvent(t) {
  let bi = -1, bd = 1e9;
  c().events.forEach((e, i) => {
    if (e.st === "drop") return;
    const d = t < e.s ? e.s - t : (t > e.e ? t - e.e : 0);
    if (d < bd) { bd = d; bi = i; }
  });
  return bi;
}
function addEvent() {
  snapshot();
  const t = au.currentTime || 0;
  c().events.push({s: Math.max(0, t - 1), e: Math.min(c().dur, t + 1), st: "new"});
  c().events.sort((a, b) => a.s - b.s);
  sel = c().events.findIndex(e => Math.abs(e.s - Math.max(0, t - 1)) < 1e-6);
  save(); renderAll();
}

// 交互
cv.onclick = (ev) => {
  const r = cv.getBoundingClientRect();
  const padL = 34, padR = 8;
  const t = (ev.clientX - r.left - padL) / (r.width - padL - padR) * c().dur;
  au.currentTime = Math.max(0, Math.min(c().dur, t));
  draw();
};
au.ontimeupdate = () => {
  if (playEnd && au.currentTime >= playEnd) { au.pause(); playEnd = 0; }
  draw();
};
au.onloadedmetadata = draw;
window.onresize = () => draw();

document.getElementById("btnPlay").onclick = () => { playEnd = 0; au.paused ? au.play() : au.pause(); };
document.querySelectorAll("#speed button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("#speed button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    au.playbackRate = +b.dataset.r;
  };
});
document.getElementById("btnPrev").onclick = () => {
  const t = au.currentTime;
  const evs = c().events;
  let idx = -1;
  for (let k = evs.length - 1; k >= 0; k--) {
    if (evs[k].st !== "drop" && evs[k].e < t - 0.1) { idx = k; break; }
  }
  if (idx < 0) idx = evs.findIndex(e => e.st !== "drop");
  if (idx >= 0) { sel = idx; au.currentTime = Math.max(0, evs[idx].s - 0.3); renderRows(); draw(); }
};
document.getElementById("btnNext").onclick = () => {
  const t = au.currentTime;
  const idx = c().events.findIndex(e => e.st !== "drop" && e.s > t + 0.05);
  if (idx >= 0) { sel = idx; au.currentTime = Math.max(0, c().events[idx].s - 0.3); renderRows(); draw(); }
};
document.getElementById("btnAdd").onclick = addEvent;
document.getElementById("btnKeep").onclick = () => { if (sel >= 0) { snapshot(); c().events[sel].st = "keep"; save(); renderAll(); } };
document.getElementById("btnDrop").onclick = () => { if (sel >= 0) { snapshot(); c().events[sel].st = "drop"; save(); renderAll(); } };
document.getElementById("btnUndo").onclick = undo;
document.getElementById("btnDone").onclick = () => { snapshot(); c().checked = !c().checked; save(); renderClips(); loadClip2(); };
function loadClip2() {
  const cl = c();
  document.getElementById("btnDone").textContent = cl.checked ? "已听完 ✓（点击取消）" : "本段已听完 ✓";
}

document.addEventListener("keydown", ev => {
  const tag = (ev.target.tagName || "").toLowerCase();
  if (tag === "textarea" || tag === "input") return;
  if (ev.key === " " && !ev.ctrlKey) { ev.preventDefault(); playEnd = 0; au.paused ? au.play() : au.pause(); }
  if (ev.key === "ArrowRight") { au.currentTime = Math.min(c().dur, au.currentTime + 2); draw(); }
  if (ev.key === "ArrowLeft") { au.currentTime = Math.max(0, au.currentTime - 2); draw(); }
  if (ev.key === "n" || ev.key === "N") addEvent();
  if ((ev.key === "k" || ev.key === "K") && sel >= 0) { snapshot(); c().events[sel].st = "keep"; save(); renderAll(); }
  if ((ev.key === "d" || ev.key === "D") && sel >= 0) { snapshot(); c().events[sel].st = "drop"; save(); renderAll(); }
  if (ev.key === "j" || ev.key === "J") document.getElementById("btnPrev").onclick();
  if (ev.key === "l" || ev.key === "L") document.getElementById("btnNext").onclick();
  if (ev.ctrlKey && (ev.key === "z" || ev.key === "Z")) { ev.preventDefault(); undo(); }
});

document.getElementById("btnReset").onclick = () => {
  if (!confirm("清空本页所有判定，回到自动草稿？")) return;
  state = buildDefault(); cur = 0; sel = -1; undoStack = [];
  save(); loadClip();
};

document.getElementById("btnExport").onclick = () => {
  const lines = ["audio,event_id,start_sec,end_sec"];
  state.clips.forEach(cl => {
    const keep = cl.events.filter(e => e.st !== "drop").sort((a, b) => a.s - b.s);
    keep.forEach((e, i) => {
      lines.push([cl.file, i + 1, fmt(Math.max(0, e.s)), fmt(Math.max(e.s + 0.1, e.e))].join(","));
    });
  });
  const txt = lines.join("\n") + "\n";
  const blob = new Blob(["\ufeff" + txt], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "events_truth.csv";
  document.body.appendChild(a); a.click(); a.remove();
  document.getElementById("outTxt").value = txt;
  document.getElementById("modal").classList.add("on");
};
document.getElementById("btnCopy").onclick = () => {
  const ta = document.getElementById("outTxt");
  ta.select(); document.execCommand("copy");
  document.getElementById("btnCopy").textContent = "已复制";
  setTimeout(() => document.getElementById("btnCopy").textContent = "复制", 1200);
};
document.getElementById("btnClose").onclick = () => document.getElementById("modal").classList.remove("on");

loadClip();
</script>
</body>
</html>
